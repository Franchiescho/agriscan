version: '3'

services:
  version: '3'

services:
  mongo-express:
    image: mongo-express:latest
    container_name: mongo_express
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_SERVER: cluster0.obksqpk.mongodb.net
      ME_CONFIG_MONGODB_PORT: 27017
      ME_CONFIG_MONGODB_ADMINUSERNAME: gildoneto2004
      ME_CONFIG_MONGODB_ADMINPASSWORD: 1630neto
      ME_CONFIG_MONGODB_AUTH_DATABASE: admin
      ME_CONFIG_MONGODB_ENABLE_ADMIN: true
      ME_CONFIG_MONGODB_USE_UNIFIED_TOPOLOGY: true
      ME_CONFIG_BASICAUTH: false


volumes:
  mongo-data:

networks:
  app-network:
    driver: bridge
